# What the join bot says about each Circle account when a community's sign-up
# or profile form has a required question (circle_leads/join/forms.py).
#
# The bot answers from these facts first. Since 2026-11-16 (the user's
# decision), a required question the facts do not settle gets the most
# plausible answer for this persona from the model, stored with source
# `ai_invented` -- never a contact detail, link, ID or date, and an opt-in to
# share data is declined. Only required fields are ever filled.
#
# `default` applies to every account; an entry under `accounts` (main, test,
# 3, 4, ...) adds or overrides facts for that one account. Override the whole
# file with JOIN_PERSONAS_PATH. A fact left null is dropped.

# Profile texts approved by the user on 2026-09-23 (WORKLOG.md, the
# foundercareers join). A choice field such as "Role" takes the option closest
# to these facts -- "Partner" on foundercareers.
