exclude_job_seekers: true
minimum_confidence: 0.6
harvest_recency_days: 30
harvest_all_spaces: false
max_search_niches: 12
llm_escalation_threshold: 55
keywords:
  include:
  - looking for
  - looking for recommendations
  - any recommendations
  - need a
  - needs a
  - seeking a
  - hiring a
  - hire an agency
  - find a vendor
  - agency needed
  - vendor needed
  - consultant needed
  - partner needed
  - contractor needed
  - freelance
  - fractional
  - help with
  - recommendations for
  - who can recommend
  - intro to
  - looking to switch
  - switching from
  - current agency isn't
  - vs
  - alternatives to
  - should we outsource
  - thinking about outsourcing
  - build vs buy
  - migrating to
  - implementing
  - just raised
  - Series A
  - Series B
  - opened an office
  - launching in
  - our site converts
  - churn is
  - spending too much on
  - accountant keeps
  - need to deploy
  - cash to deploy
  - RFP
  - budget approved
  - PM me if you know
  - know anyone
  exclude:
  - looking for a job
  - open to work
  - seeking employment
  - available for hire
  - job seeker
  - resume
  - CV
  - technical co-founder
  - looking for a co-founder
  - side project
  - just launched
  - feedback welcome
  - AMA
  - I offer
  - we offer
  - hire me
  - DM me for services
  - our agency helps
  - slots open for clients
  - book recommendation
  - podcast about
  - meetup next
  - conference speakers
  - negotiate salary
  - imposter syndrome
  - channel guidelines
  - bot integration
  - full-stack engineer job
  - senior engineer opening
  - friend wants to get into
  - where should they look for jobs
  - link building
  - backlinks
  - guest post exchange
  - niche edits
  - link exchange
scoring:
  hiring_intent: 40
  target_role_match: 20
  target_skill_match: 15
  budget_mentioned: 10
  company_identified: 5
  recent_post: 10
  recency_days: 7
priority_thresholds:
  high: 80
  medium: 50
excluded_content:
- direct_messages
- member_bios
- email_addresses
- phone_numbers
retention_days: 30
rate_limit:
  requests_per_minute: 60
  max_retries: 5
  backoff_base_seconds: 2.0
  max_backoff_seconds: 60.0
