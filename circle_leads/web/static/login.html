<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Warmr</title>
<style>
  :root {
    --bg: #f7f8fa; --panel: #fff; --ink: #101828; --muted: #667085;
    --line: #eaecf0; --accent: #ef4444; --danger: #b42318;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--ink);
    font: 15px/1.55 "Inter", ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .brand {
    display: flex; align-items: center; gap: 10px; justify-content: center;
    margin-bottom: 20px; font-size: 22px; font-weight: 800; letter-spacing: -.02em;
  }
  .brand .logo {
    width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
    background: linear-gradient(135deg, #ff8a4c, #ef4444); font-size: 19px;
  }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 32px; width: min(380px, calc(100vw - 32px));
    box-shadow: 0 1px 3px rgb(0 0 0 / .06);
  }
  h1 { margin: 0 0 4px; font-size: 19px; }
  p.sub { margin: 0 0 22px; color: var(--muted); font-size: 13px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  input {
    width: 100%; padding: 10px 12px; font: inherit; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    width: 100%; margin-top: 14px; padding: 10px; font: inherit; font-weight: 600;
    color: #fff; background: var(--accent); border: 0; border-radius: 8px;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.07); }
  .error {
    margin-top: 12px; padding: 9px 11px; border-radius: 7px; font-size: 13px;
    background: color-mix(in srgb, var(--danger) 12%, transparent);
    color: var(--danger);
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <form class="card" id="form">
    <div class="brand"><span class="logo">🔥</span> Warmr</div>
    <p class="sub">This dashboard holds other people's posts. Sign in to continue.</p>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password"
           autofocus required>
    <button type="submit">Sign in</button>
    <div class="error" id="error" hidden></div>
  </form>

<script>
const form = document.getElementById('form');
const errorBox = document.getElementById('error');

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  errorBox.hidden = true;

  const body = new FormData();
  body.append('password', document.getElementById('password').value);

  try {
    const response = await fetch('/login', { method: 'POST', body });
    if (response.ok) {
      window.location = '/';
      return;
    }
    const data = await response.json().catch(() => ({}));
    errorBox.textContent = data.error || 'Sign in failed.';
    errorBox.hidden = false;
  } catch {
    errorBox.textContent = 'Could not reach the server.';
    errorBox.hidden = false;
  }
});
</script>
</body>
</html>
