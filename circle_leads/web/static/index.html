<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Warmr Circle</title>
<link rel="stylesheet" href="/ui/__UI_VERSION__/app.css">
<script type="module" src="/ui/__UI_VERSION__/main.js"></script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="logo" aria-hidden="true">🔥</span> Warmr Circle</div>
    <nav aria-label="Разделы">
      <a href="#/analytics" data-section="analytics"><span class="ic" aria-hidden="true">📊</span>Аналитика</a>
      <a href="#/monitoring" data-section="monitoring"><span class="ic" aria-hidden="true">📡</span>Мониторинг</a>
      <a href="#/leads" data-section="leads"><span class="ic" aria-hidden="true">🎯</span>Лиды</a>
      <a href="#/communities" data-section="communities"><span class="ic" aria-hidden="true">🌐</span>База сообществ</a>
      <a href="#/attention" data-section="attention"><span class="ic" aria-hidden="true">🔔</span>Требует внимания<span id="attention-badge" class="badge" hidden></span></a>
      <div class="sep" role="separator"></div>
      <a href="#/config" data-section="config"><span class="ic" aria-hidden="true">⚙️</span>Конфиг</a>
    </nav>
    <button id="logout" class="btn btn-ghost">Выйти</button>
  </aside>
  <main id="view" aria-live="polite"></main>
</div>

<div id="drawer" hidden>
  <div id="drawer-backdrop"></div>
  <aside class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
    <header class="drawer-head">
      <h2 id="drawer-title"></h2>
      <button id="drawer-close" class="btn btn-ghost" aria-label="Закрыть">✕</button>
    </header>
    <div id="drawer-body"></div>
  </aside>
</div>
<div id="toasts" aria-live="polite"></div>
<noscript>Дашборду нужен JavaScript.</noscript>
</body>
</html>
