# Render blueprint — FREE tier.
#
# Render's free tier: web services are free (they spin down after 15 min idle),
# but cron jobs / background workers and the managed Postgres (expires in 30
# days) are not a good fit. So this deploys ONE free web service and expects an
# external Postgres (your Supabase) via CIRCLE_LEADS_DB.
#
# Scheduling: the harvest cadence is set in the dashboard (Config tab) and stored
# in the DB. A free external pinger (e.g. cron-job.org) hits /api/tick on an
# interval; that endpoint runs a harvest only when the schedule says it's due.
#
# Setup:
#   1. New > Blueprint, point at this repo.
#   2. Set the sync:false env vars in the Render dashboard after first deploy:
#      CIRCLE_LEADS_DB  = your Supabase Postgres URL (postgresql://...)
#      DASHBOARD_PASSWORD, EXA_API_KEY, OPENAI_API_KEY, TICK_TOKEN (any secret)
#   3. Set the harvest schedule in the dashboard's Config tab.
#   4. Create a free cron at cron-job.org (or similar) that GETs, hourly:
#        https://<your-app>.onrender.com/api/tick?token=<TICK_TOKEN>
#      This also keeps the free web service awake.

services:
  - type: web
    name: circle-leads
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /login
    envVars:
      - key: CIRCLE_LEADS_DB
        sync: false          # your Supabase Postgres URL
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: DASHBOARD_SECRET_KEY
        generateValue: true
      - key: DASHBOARD_HTTPS
        value: "true"
      - key: TICK_TOKEN
        sync: false          # a secret; the pinger passes it as ?token=
      - key: EXA_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
