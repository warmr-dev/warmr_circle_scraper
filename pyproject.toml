[project]
name = "circle-leads"
version = "0.1.0"
description = "Warmr Circle — consent-first hiring-lead discovery across authorized Circle.so communities"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "requests>=2.32",
    "pyyaml>=6.0",
    "click>=8.1",
    "tenacity>=8.3",
    # Web dashboard (also listed under optional-dependencies.web so
    # `pip install -e '.[web]'` keeps working). Required at the top level so
    # Vercel's FastAPI builder installs FastAPI instead of only detecting it.
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40", "openai>=1.40"]
browser = ["playwright>=1.40"]
crypto = ["cryptography>=42.0"]  # optional at-rest encryption of stored credentials
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
    "psycopg[binary]>=3.1",
]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27"]

[project.scripts]
circle-leads = "circle_leads.cli.main:cli"
circle-connector = "circle_leads.connector.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["circle_leads*"]

[tool.setuptools.package-data]
circle_leads = ["web/static/**/*", "config/*.yaml"]

# Vercel auto-detects FastAPI from pyproject.toml, then looks for a top-level
# `app` in main.py (the CLI). Point it at the dashboard ASGI export instead.
[tool.vercel]
entrypoint = "app:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
