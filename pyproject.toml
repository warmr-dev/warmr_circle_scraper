[project]
name = "circle-leads"
version = "0.1.0"
description = "Consent-first hiring-lead discovery across authorized Circle.so communities"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "requests>=2.32",
    "pyyaml>=6.0",
    "click>=8.1",
    "tenacity>=8.3",
    # Kept in the base install (rather than only in the "web" extra below) so
    # that installers which only resolve base dependencies -- e.g. Vercel's
    # Python builder -- still pull in the dashboard's runtime deps. See
    # circle_leads/web/vercel_app.py and deploy/DEPLOY.md.
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40", "openai>=1.40"]
browser = ["playwright>=1.40"]
# Empty now (kept for backward compatibility with `pip install -e '.[web]'` in
# the Dockerfile/docs) -- these packages moved into the base dependencies above.
web = []
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27"]

[project.scripts]
circle-leads = "circle_leads.cli.main:cli"
circle-connector = "circle_leads.connector.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["circle_leads*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Vercel's Python builder looks for a top-level FastAPI `app` in main.py /
# app.py / server.py etc. This repo's main.py is a CLI entrypoint instead, so
# point Vercel at the dashboard's FastAPI app explicitly. Read
# circle_leads/web/vercel_app.py and deploy/DEPLOY.md before relying on this:
# the dashboard's background jobs, sessions, and default SQLite storage are
# NOT compatible with Vercel's serverless model.
[tool.vercel]
entrypoint = "circle_leads.web.vercel_app:app"
