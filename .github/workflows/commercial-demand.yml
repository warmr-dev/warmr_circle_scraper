name: Commercial demand contracts
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev,llm]'
      - name: Offline classifier, retry, attribution and export contracts
        run: >-
          python -m pytest -q
          tests/test_ai_classifier.py tests/test_commercial_demand.py
          tests/test_pipeline.py tests/test_triage.py
          tests/test_vini_ingest.py tests/test_storage.py
