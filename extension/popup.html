<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Warmr Circle Cookie Sync</title>
<style>
  body { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         width: 280px; margin: 0; padding: 14px; color: #1a1a1a; background: #fff; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  .host { font-weight: 600; word-break: break-all; margin-bottom: 10px; }
  .host span { font-weight: 400; color: #555; }
  button { width: 100%; padding: 9px; font-size: 13px; font-weight: 600; border: none;
           border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #status { margin-top: 10px; font-size: 12px; color: #666; min-height: 32px; line-height: 1.4; }
  #status.ok { color: #16a34a; }
  #status.err { color: #dc2626; }
  #status.warn { color: #d97706; }
  a { color: #2563eb; font-size: 12px; text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <h1>Warmr Circle Cookie Sync</h1>
  <div class="host">Tab: <span id="host">…</span></div>
  <button id="send">Send session cookie</button>
  <div id="status"></div>
  <p><a href="#" id="open-options">Settings (dashboard URL, token)</a></p>
  <script src="popup.js"></script>
</body>
</html>
